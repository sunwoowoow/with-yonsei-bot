<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>With YONSEI - AI 맞춤 비교과 추천</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- 모바일 화면 프레임 컨테이너 -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl flex flex-col h-[85vh] max-h-[750px] border border-slate-200 overflow-hidden relative">
        
        <!-- 에이닷 스타일 상단 헤더바 -->
        <header class="px-5 py-4 bg-white border-b border-slate-100 flex items-center justify-between z-10">
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">With YONSEI</span>
            </div>
            <div class="flex items-center gap-3 text-slate-500 text-sm">
                <span>💬</span>
                <span>⚙️</span>
            </div>
        </header>

        <!-- 챗봇 대화 출력 영역 -->
        <div id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm bg-gradient-to-b from-slate-50/50 to-white">
            <!-- JavaScript로 동적 메시지 삽입 -->
        </div>

        <!-- 하단 입력 및 선택지 영역 -->
        <div id="input-area" class="p-4 bg-white border-t border-slate-100 shadow-lg">
            <!-- 동적으로 버튼이나 입력창이 들어감 -->
        </div>
    </div>

    <!-- JavaScript 로직 -->
    <script>
        let programsDatabase = [];
        let userState = {
            grade: null,
            department: null,
            category: null,
            mode: null
        };

        const chatContainer = document.getElementById('chat-container');
        const inputArea = document.getElementById('input-area');

        // 페이지가 열릴 때 깃허브에 저장된 programs.json 데이터를 실시간으로 불러옴
        async function loadProgramsData() {
            try {
                const response = await fetch('./programs.json');
                if (!response.ok) throw new Error('데이터를 불러오지 못했습니다.');
                programsDatabase = await response.json();
                console.log("비교과 데이터 로드 성공:", programsDatabase);
            } catch (error) {
                console.error("데이터 로드 오류:", error);
                // 혹시 모를 로드 실패 시 기본 비상 데이터 세팅
                programsDatabase = [];
            }
            startChat();
        }

        // 메시지 추가 함수 (봇 / 사용자)
        function appendMessage(sender, text, isCharacter = false) {
            const isBot = sender === 'bot';
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `flex ${isBot ? 'justify-start' : 'justify-end'} mb-3 items-end gap-2`;
            
            let characterHTML = '';
            if (isBot) {
                characterHTML = `
                    <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center shrink-0 shadow-xs text-base">
                        🧸
                    </div>
                `;
            }

            bubbleDiv.innerHTML = `
                ${characterHTML}
                <div class="${isBot ? 'bg-slate-100 text-slate-800' : 'bg-blue-600 text-white'} max-w-[78%] px-4 py-3 rounded-2xl ${isBot ? 'rounded-bl-xs' : 'rounded-br-xs'} shadow-xs text-xs leading-relaxed">
                    ${text}
                </div>
            `;
            chatContainer.appendChild(bubbleDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // --- 꼬리에 꼬리를 무는 대화 단계별 제어 ---

        // Step 1: 학년 묻기
        function startChat() {
            appendMessage('bot', "안녕하세요! 연세대학교 미래캠퍼스 맞춤형 비교과 추천 챗봇입니다 😊<br>오늘도 성장을 위한 멋진 비교과 프로그램을 찾아드릴게요!<br><br>먼저 <b>현재 몇 학년</b>이신가요?", true);
            
            inputArea.innerHTML = `
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="handleGrade(1)" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">1학년</button>
                    <button onclick="handleGrade(2)" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">2학년</button>
                    <button onclick="handleGrade(3)" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">3학년</button>
                    <button onclick="handleGrade(4)" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">4학년</button>
                </div>
            `;
        }

        // Step 1 처리 -> Step 2 (학과 묻기)
        function handleGrade(grade) {
            userState.grade = grade;
            appendMessage('user', `${grade}학년입니다.`);
            
            setTimeout(() => {
                appendMessage('bot', `아, <b>${grade}학년</b>이시군요! 소속 <b>학과(또는 전공)</b>를 입력해 주세요.`, true);
                inputArea.innerHTML = `
                    <div class="flex gap-2">
                        <input type="text" id="dept-input" placeholder="예: 소프트웨어학부, 경영학부 등" class="flex-1 px-3 py-2.5 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500 bg-slate-50">
                        <button onclick="handleDepartment()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-blue-700 transition">입력</button>
                    </div>
                `;
                document.getElementById('dept-input').focus();
            }, 400);
        }

        // Step 2 처리 -> Step 3 (관심사 묻기)
        function handleDepartment() {
            const input = document.getElementById('dept-input');
            const dept = input.value.trim() || "소속 미입력";
            userState.department = dept;
            appendMessage('user', `${dept}입니다.`);

            setTimeout(() => {
                appendMessage('bot', `좋습니다! 요즘 가장 관심 있는 <b>활동 분야(카테고리)</b>를 선택해 주세요.`, true);
                inputArea.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="handleCategory('AI')" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">🤖 AI·SW</button>
                        <button onclick="handleCategory('기독교')" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">✝️ 기독교·인성</button>
                        <button onclick="handleCategory('특강')" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">💡 특강·취업</button>
                        <button onclick="handleCategory('운동')" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">⚽ 운동·건강</button>
                    </div>
                `;
            }, 400);
        }

        // Step 3 처리 -> Step 4 (대면/비대면 묻기)
        function handleCategory(category) {
            userState.category = category;
            const categoryNames = { AI: 'AI·SW', 기독교: '기독교·인성', 특강: '특강·취업', 운동: '운동·건강' };
            appendMessage('user', `${categoryNames[category]} 분야에 관심이 있어요.`);

            setTimeout(() => {
                appendMessage('bot', `거의 다 되었습니다! 선호하시는 <b>운영 방식</b>을 선택해 주세요.`, true);
                inputArea.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="handleMode('대면')" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">🏢 대면</button>
                        <button onclick="handleMode('비대면')" class="py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">💻 비대면(온라인)</button>
                    </div>
                `;
            }, 400);
        }

        // Step 4 처리 -> 최종 필터링 및 추천 카드 출력
        function handleMode(mode) {
            userState.mode = mode;
            appendMessage('user', `${mode} 방식을 선호합니다.`);

            setTimeout(() => {
                appendMessage('bot', `입력하신 조건에 딱 맞는 최신 비교과 프로그램을 불러오는 중입니다... 🔍`, true);
                
                // 깃허브에서 가져온 programs.json 데이터에서 조건 필터링 수행
                const matchedPrograms = programsDatabase.filter(p => {
                    const categoryMatch = p.category === userState.category;
                    const modeMatch = p.operation_mode === userState.mode;
                    return categoryMatch && modeMatch;
                });

                setTimeout(() => {
                    showResults(matchedPrograms);
                }, 700);

            }, 400);
        }

        // Step 5: 결과 렌더링
        function showResults(programs) {
            if (programs.length === 0) {
                appendMessage('bot', `아쉽게도 현재 조건에 완벽히 일치하는 프로그램이 없어요 🥲<br>나중에 다시 시도해 주세요!`, true);
                inputArea.innerHTML = `
                    <button onclick="resetChat()" class="w-full py-2.5 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 transition text-xs">처음부터 다시 시작하기</button>
                `;
                return;
            }

            let resultHTML = `조건에 맞는 총 <b>${programs.length}개</b>의 비교과 프로그램을 찾았어요!<div class="mt-2 space-y-2">`;
            
            programs.forEach(p => {
                resultHTML += `
                    <div class="p-3 bg-white border border-slate-200 rounded-xl shadow-xs">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded font-medium">${p.operation_mode}</span>
                            <span class="text-[10px] text-slate-400">${p.application_period}</span>
                        </div>
                        <h4 class="font-bold text-slate-900 text-xs">${p.title}</h4>
                        <p class="text-[11px] text-slate-500 mt-1">${p.introduction}</p>
                        <a href="${p.url}" target="_blank" class="inline-block mt-2 text-[11px] font-semibold text-blue-600 hover:underline">상세 정보 및 신청 바로가기 →</a>
                    </div>
                `;
            });
            resultHTML += `</div>`;

            appendMessage('bot', resultHTML, true);
            
            inputArea.innerHTML = `
                <button onclick="resetChat()" class="w-full py-2.5 bg-blue-50 text-blue-700 font-semibold rounded-xl hover:bg-blue-100 transition text-xs">🔄 다른 조건으로 다시 검색하기</button>
            `;
        }

        // 초기화 함수
        function resetChat() {
            userState = { grade: null, department: null, category: null, mode: null };
            chatContainer.innerHTML = '';
            startChat();
        }

        // 페이지 로드 시 데이터와 함께 시작
        window.onload = loadProgramsData;
    </script>
</body>
</html>
